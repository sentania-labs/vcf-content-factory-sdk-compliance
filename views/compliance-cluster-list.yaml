id: 8941f4db-d656-491e-bbba-776c3db57ec9
name: "[VCF Content Factory] Compliance Clusters"
description: >
  Per-cluster compliance score, applied SCG benchmark and control counts
  from the VCF-CF Compliance adapter (stitched onto VMWARE
  ClusterComputeResource; covers vSAN controls). Clusters carry few
  scored controls, so a cluster's score is coarse (0, 50 or 100);
  Failing is shown beside it so that is visible. Feeds vCenter &
  Networking W3 (Clusters). Score columns list every row, unfiltered:
  VCF Ops keeps a metric's last value, so a cluster that moved to a
  version with no SCG can show a retained score, identified by the No
  SCG flag column beside it (owner accepted, 2026-09-23). Unreadable
  controls count as failing in the score (adapter build 63); the
  Unreadable column shows how many, and a "Compliance data not
  collected" alert explains why. The totals row is sums only (issue
  #168). Sort by Compliance Score ascending in the dashboard widget to
  surface the worst cluster first.
subject:
  adapter_kind: VMWARE
  resource_kind: ClusterComputeResource
columns:
  - attribute: VCF-CF Compliance|profile_name
    display_name: "SCG Applied"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|score
    display_name: "Compliance Score (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|fail_count
    display_name: "Failing"
  - attribute: VCF-CF Compliance|unreadable_count
    display_name: "Unreadable"
  - attribute: VCF-CF Compliance|non_compliant
    display_name: "Non-Compliant"
  - attribute: VCF-CF Compliance|no_benchmark
    display_name: "No SCG"

summary:
  display_name: "Totals"
  aggregation: SUM
  columns: [2, 3, 4, 5]

released: false
version: "1.0.0"
