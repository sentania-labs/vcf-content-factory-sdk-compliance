id: 65abb586-5499-480f-9452-9cb036dd2f10
name: "[VCF Content Factory] Compliance VM Detail"
description: >
  Per-VM compliance scores, control counts and applied SCG benchmark from
  the VCF-CF Compliance adapter (stitched onto VMWARE VirtualMachine; a
  VM's SCG follows its host's ESX version). Feeds VMs W2 (VM Compliance).
  A score kept after the version moved to one with no SCG is marked by No
  SCG (owner accepted, 2026-09-23). Unreadable controls are outside the
  score (build 95: passed over evaluated, from what was read). Not Read = 1,
  beside the score, means not every control was read this cycle:
  the score is from what was read or, when nothing could be read, from an
  earlier cycle, as is Controls Evaluated (and Unreadable, if even the
  version was unreadable); the Objects with Unreadable Controls list says
  why. "Compliance data not collected" fires after two cycles. Totals are
  sums only (issue #168). Sort by Compliance Score ascending to surface
  non-compliant VMs first.
subject:
  adapter_kind: VMWARE
  resource_kind: VirtualMachine
columns:
  - attribute: summary|parentHost
    display_name: "Host"
    is_property: true
    is_string_attribute: true
  - attribute: summary|parentCluster
    display_name: "Cluster"
    is_property: true
    is_string_attribute: true
  - attribute: summary|parentVcenter
    display_name: "vCenter"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|profile_name
    display_name: "SCG Applied"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|score
    display_name: "Compliance Score (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|has_unreadable
    display_name: "Not Read"
  - attribute: VCF-CF Compliance|total_count
    display_name: "Controls Evaluated"
  - attribute: VCF-CF Compliance|fail_count
    display_name: "Failing"
  - attribute: VCF-CF Compliance|unreadable_count
    display_name: "Unreadable"
  - attribute: VCF-CF Compliance|non_compliant
    display_name: "Non-Compliant"
  - attribute: VCF-CF Compliance|no_benchmark
    display_name: "No SCG"

summary:
  display_name: "Totals"
  aggregation: SUM
  columns: [5, 6, 7, 8, 9, 10]

released: false
version: "1.0.0"
