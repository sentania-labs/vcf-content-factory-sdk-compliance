id: 32491ab8-e6c3-4f01-ac7d-4d656604f8f6
name: "[VCF Content Factory] Compliance Objects by SCG Version"
description: >
  Per-vCenter object counts by the SCG benchmark actually applied, from
  the VCF-CF Compliance adapter's per-vCenter rollup (stitched onto
  VMWARE VMwareAdapter Instance). Includes the unknown bucket for
  objects whose governing version could not be read and had no prior
  benchmark (never a guess, never "no benchmark"). Feeds Environment
  Overview W4 (Objects by SCG Version). Build 95 (issue #32): newest
  guide first, so the versions in use on a current estate (9.1, 9.0) are
  the first columns, and every bucket is listed. Build 102 (issue #59):
  the per-SCG columns count scored objects only (scored_objects), so the
  table agrees with Rollup|All|scored; objects with no applicable control
  are not counted. The totals row sums the five SCG columns.
subject:
  adapter_kind: VMWARE
  resource_kind: VMwareAdapter Instance
columns:
  - attribute: VCF-CF Compliance|Rollup|Benchmark|SCG_9.1|scored_objects
    display_name: "SCG 9.1 Scored Objects"
  - attribute: VCF-CF Compliance|Rollup|Benchmark|SCG_9.0|scored_objects
    display_name: "SCG 9.0 Scored Objects"
  - attribute: VCF-CF Compliance|Rollup|Benchmark|SCG_8.0|scored_objects
    display_name: "SCG 8.0 Scored Objects"
  - attribute: VCF-CF Compliance|Rollup|Benchmark|SCG_7.0|scored_objects
    display_name: "SCG 7.0 Scored Objects"
  - attribute: VCF-CF Compliance|Rollup|Benchmark|SCG_6.7|scored_objects
    display_name: "SCG 6.7 Scored Objects"
  - attribute: VCF-CF Compliance|Rollup|Benchmark|none|objects
    display_name: "No Benchmark"
  - attribute: VCF-CF Compliance|Rollup|Benchmark|unknown|objects
    display_name: "Unknown (Version Unreadable)"

summary:
  display_name: "Environment Totals"
  aggregation: SUM
  columns: [0, 1, 2, 3, 4]

released: false
version: "1.0.0"
