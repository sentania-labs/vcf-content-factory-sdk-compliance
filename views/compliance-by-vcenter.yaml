id: e4838292-faf0-494a-a6af-fb92ada63585
name: "[VCF Content Factory] Compliance by vCenter and Object Type"
description: >
  Per-vCenter compliance rollup by object kind from the VCF-CF Compliance
  adapter, on the VMWARE VMwareAdapter Instance. All Controls Passing, Passed and Evaluated are the
  vCenter's totals across every kind: summed down the totals row, Passed
  over Evaluated is the Environment Controls Passing tile. vCenter Appliance
  Controls Passing is the vCenter appliance kind only (its VAMI and vCenter
  settings controls). Per kind: Controls Passing (controls passed over
  controls evaluated; unreadable controls are in neither count, and with
  nothing evaluated there is no percentage, never 100), objects scored,
  non-compliant, and Not in VCF Ops (listed by vCenter, no VCF Operations
  resource, so not scored). Controls Unreadable counts unreadable controls
  across every kind. The totals row sums the counts, never a percentage.
  Feeds Environment Overview W3. Sort by All Controls Passing ascending to surface the
  worst vCenter first.
subject:
  adapter_kind: VMWARE
  resource_kind: VMwareAdapter Instance
columns:
  - attribute: summary|version
    display_name: "vCenter Version"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|Rollup|All|pass_rate
    display_name: "All Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|All|controls_passed
    display_name: "All Controls Passed"
  - attribute: VCF-CF Compliance|Rollup|All|controls_evaluated
    display_name: "All Controls Evaluated"
  - attribute: VCF-CF Compliance|Rollup|vCenter|pass_rate
    display_name: "vCenter Appliance Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|Host|pass_rate
    display_name: "Host Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|Host|scored
    display_name: "Host Scored"
  - attribute: VCF-CF Compliance|Rollup|Host|non_compliant
    display_name: "Host Non-Compliant"
  - attribute: VCF-CF Compliance|Rollup|Host|unmatched
    display_name: "Host Not in VCF Ops"
  - attribute: VCF-CF Compliance|Rollup|VM|pass_rate
    display_name: "VM Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|VM|scored
    display_name: "VM Scored"
  - attribute: VCF-CF Compliance|Rollup|VM|non_compliant
    display_name: "VM Non-Compliant"
  - attribute: VCF-CF Compliance|Rollup|VM|unmatched
    display_name: "VM Not in VCF Ops"
  - attribute: VCF-CF Compliance|Rollup|Cluster|pass_rate
    display_name: "Cluster Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|Cluster|scored
    display_name: "Cluster Scored"
  - attribute: VCF-CF Compliance|Rollup|Cluster|non_compliant
    display_name: "Cluster Non-Compliant"
  - attribute: VCF-CF Compliance|Rollup|Cluster|unmatched
    display_name: "Cluster Not in VCF Ops"
  - attribute: VCF-CF Compliance|Rollup|vDS|pass_rate
    display_name: "vDS Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|vDS|scored
    display_name: "vDS Scored"
  - attribute: VCF-CF Compliance|Rollup|vDS|non_compliant
    display_name: "vDS Non-Compliant"
  - attribute: VCF-CF Compliance|Rollup|vDS|unmatched
    display_name: "vDS Not in VCF Ops"
  - attribute: VCF-CF Compliance|Rollup|Portgroup|pass_rate
    display_name: "Portgroup Controls Passing (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|Rollup|Portgroup|scored
    display_name: "Portgroup Scored"
  - attribute: VCF-CF Compliance|Rollup|Portgroup|non_compliant
    display_name: "Portgroup Non-Compliant"
  - attribute: VCF-CF Compliance|Rollup|Portgroup|unmatched
