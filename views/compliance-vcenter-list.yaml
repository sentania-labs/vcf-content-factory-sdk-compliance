id: 505871b4-4637-4fba-975e-2a4eba3fb2b2
name: "[VCF Content Factory] Compliance vCenter Servers"
description: >
  Per-vCenter compliance score, applied SCG benchmark and control counts
  from the VCF-CF Compliance adapter (stitched onto VMWARE
  VMwareAdapter Instance). Feeds vCenter & Networking W2 (vCenter
  Servers). Score columns list every row, unfiltered: VCF Ops keeps a
  metric's last value, so a vCenter that moved to a version with no SCG
  can show a retained score, identified by the No SCG flag column
  beside it (owner accepted, 2026-09-23). Unreadable controls count as
  failing in the score (adapter build 63); the Unreadable column shows
  how many, and a "Compliance data not collected" alert explains why.
  The totals row is sums only (issue #168). Sort by Compliance Score
  ascending in the dashboard widget to surface the worst vCenter
  first.
subject:
  adapter_kind: VMWARE
  resource_kind: VMwareAdapter Instance
columns:
  - attribute: summary|version
    display_name: "vCenter Version"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|profile_name
    display_name: "SCG Applied"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|score
    display_name: "Compliance Score (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|fail_count
    display_name: "Failing"
  - attribute: VCF-CF Compliance|unreadable_count
    display_name: "Unreadable"
  - attribute: VCF-CF Compliance|non_compliant
    display_name: "Non-Compliant"
  - attribute: VCF-CF Compliance|no_benchmark
    display_name: "No SCG"

summary:
  display_name: "Totals"
  aggregation: SUM
  columns: [3, 4, 5, 6]

released: false
version: "1.0.0"
