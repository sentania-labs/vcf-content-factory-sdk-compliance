id: 32eddbd1-2f98-4c44-bc91-1729f40a88b6
name: "[VCF Content Factory] Compliance Distributed Portgroups"
description: >
  Per-portgroup compliance score, applied SCG benchmark and control
  counts from the VCF-CF Compliance adapter (stitched onto VMWARE
  DistributedVirtualPortgroup). Feeds vCenter & Networking W5
  (Distributed Portgroups). This view does not filter rows to
  no_benchmark = 0 / total_count > 0 (see Known constraints below); the
  No SCG and Non-Compliant flag columns make a stale score visible per
  row. Sort by Compliance Score ascending in the dashboard widget to
  surface the worst portgroup first.
subject:
  adapter_kind: VMWARE
  resource_kind: DistributedVirtualPortgroup
columns:
  - attribute: VCF-CF Compliance|profile_name
    display_name: "SCG Applied"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|score
    display_name: "Compliance Score (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|fail_count
    display_name: "Failing"
  - attribute: VCF-CF Compliance|unreadable_count
    display_name: "Unreadable"
  - attribute: VCF-CF Compliance|non_compliant
    display_name: "Non-Compliant"
  - attribute: VCF-CF Compliance|no_benchmark
    display_name: "No SCG"

summary:
  display_name: "Totals"
  aggregation: SUM
  columns: [2, 3, 4, 5]

released: false
version: "1.0.0"
