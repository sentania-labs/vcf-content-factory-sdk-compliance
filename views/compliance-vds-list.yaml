id: 43b7993b-b8f9-4c7f-a9a5-25e17461c5d2
name: "[VCF Content Factory] Compliance Distributed Switches"
description: >
  Per-vDS compliance score, applied SCG benchmark and control counts from
  the VCF-CF Compliance adapter (stitched onto VMWARE
  VmwareDistributedVirtualSwitch). The vDS Version column is context only:
  SCG Applied follows the owning vCenter's version, so a vDS on
  a lower version still shows its vCenter's SCG. Feeds vCenter &
  Networking W4 (Distributed Switches). A score kept after the version
  moved to one with no SCG is marked by No SCG (owner accepted,
  2026-09-23). Unreadable controls are outside the score (build 95: passed
  over evaluated, from what was read). Not Fully Read = 1, beside the
  score, means not every control was read this cycle: the score is from
  what was read or, when nothing could be read, from an earlier cycle, as
  is Controls Evaluated (and Unreadable, if even the version was
  unreadable); the Unreadable Reason column says why. "Compliance data not
  collected" fires after two cycles. Totals are sums only (issue #168).
  Sort by Compliance Score ascending to surface the worst switch first.
subject:
  adapter_kind: VMWARE
  resource_kind: VmwareDistributedVirtualSwitch
columns:
  - attribute: summary|version
    display_name: "vDS Version"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|profile_name
    display_name: "SCG Applied"
    is_property: true
    is_string_attribute: true
  - attribute: VCF-CF Compliance|score
    display_name: "Compliance Score (%)"
    red_bound: 80
    orange_bound: 90
    yellow_bound: 95
    ascending_range: true
  - attribute: VCF-CF Compliance|has_unreadable
    display_name: "Not Fully Read"
  - attribute: VCF-CF Compliance|total_count
    display_name: "Controls Evaluated"
  - attribute: VCF-CF Compliance|fail_count
    display_name: "Failing"
  - attribute: VCF-CF Compliance|unreadable_count
    display_name: "Unreadable"
  - attribute: VCF-CF Compliance|non_compliant
    display_name: "Non-Compliant"
  - attribute: VCF-CF Compliance|no_benchmark
    display_name: "No SCG"
  - attribute: VCF-CF Compliance|unreadable_reason
    display_name: "Unreadable Reason"
    is_property: true
    is_string_attribute: true

summary:
  display_name: "Totals"
  aggregation: SUM
  columns: [3, 4, 5, 6, 7, 8]

released: false
version: "1.0.0"
