id: 8200eed9-6aa3-480d-bd7e-2b1fa81b8ee5
name: "[VCF Content Factory] Compliance Objects Without Benchmark"
resource_kinds:
  - resource_kind_key: vSphere World
    adapter_kind_key: VMWARE
description: >
  Whole-environment count of objects whose version was read but has no
  bundled Security Configuration Guide to score against, summed across
  every vCenter. These objects are counted but never scored. Objects
  whose version could not be read at all are not in this count; they
  fall under non-compliant instead (the adapter's
  unreadable-is-not-compliant rule). Assigned to the vSphere World
  rollup resource (1 live object per instance; recon 2026-09-23
  confirmed the three VMwareAdapter Instance vCenters are its only
  depth-1 children on both devel and prod) and sums the per-vCenter
  VCF-CF Compliance|Rollup|All|no_benchmark metric (adapter v3 build
  60+) over those children.

  Depends on the compliance adapter v3 stitching the
  Rollup|All|no_benchmark metric onto each VMwareAdapter Instance;
  these keys are a declared contract (content/sdk-adapters/compliance/docs/overview.md,
  content/sdk-adapters/compliance/README.md) and do not exist live yet
  because v3 is not installed on either recon target. Formula is
  structurally grounded, not live-verified.

  Feeds the Compliance Environment Overview dashboard (Environment
  Compliance scoreboard, W1).
formula: |
  sum(${adaptertype=VMWARE, objecttype=VMwareAdapter Instance, metric=VCF-CF Compliance|Rollup|All|no_benchmark, depth=1})
