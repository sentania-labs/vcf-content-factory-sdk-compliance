id: 692972c7-29f3-4d00-a069-331d82a457bd
name: "[VCF Content Factory] Compliance VMs"
description: >
  The ESX Hosts pattern applied to VMs, sized for thousands of
  objects: pick a scope, see the VMs in it worst first, select one to
  see its failing controls with runbooks. No heatmap: at VM counts it
  stops being readable, the sorted list and its totals row carry the
  overview. See knowledge/designs/dashboards/compliance-vms.md.

released: false
version: "1.0.0"
hidden: true

widgets:

  # ── W1: Scope picker (World / vCenter) ───────────────────────────────

  - id: scope_picker
    type: ResourceList
    title: "Scope"
    coords: {x: 1, y: 1, w: 3, h: 12}
    column_preset: name-only
    resource_kinds:
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
      - adapter_kind: VMWARE
        resource_kind: "VMwareAdapter Instance"

  # ── W2: VM Compliance list, driven by W1, sorted worst-first ────────

  - id: vm_compliance_view
    type: View
    title: "VM Compliance"
    coords: {x: 4, y: 1, w: 9, h: 12}
    # sort_by_column / sort_by_dir (score ascending) requested in the
    # brief are not implemented for View widgets (see TOOLSET GAP in
    # the authoring report). Sort order is UI-set by the user.
    view: "[VCF Content Factory] Compliance VM Detail"

  # ── W3: Failing Controls on Selected VM, driven by W2, vm.* family ───

  - id: failing_controls
    type: AlertList
    title: "Failing Controls on Selected VM"
    coords: {x: 1, y: 13, w: 7, h: 8}
    criticality: [2, 3, 4]
    mode: all
    # depth 1: input is a VirtualMachine; no descendant carries compliance alerts, so 1 level is already full coverage.
    depth: 1
    alert_types: ["15_21"]  # Application / Compliance. Every pak alert is type 15 subType 21, so this lists all of them: per-control, "Compliance data not collected" and "Host Compliance Score Degraded" alike (no widget filter separates them; pinning the 143 definition ids was ruled out)

  # ── W4: Compliance Details, driven by W2 ────────────────────────────

  - id: vm_compliance_details
    type: PropertyList
    title: "Compliance Details"
    coords: {x: 8, y: 13, w: 5, h: 8}
    property_list:
      visual_theme: 0
      depth: 1
      show_metric_full_name: true
      properties:
        - adapter_kind: VMWARE
          resource_kind: VirtualMachine
          metric_key: "summary|parentHost"
          metric_name: "Summary|Parent Host"
          label: "Host"
          is_string_metric: true
        - adapter_kind: VMWARE
          resource_kind: VirtualMachine
          metric_key: "VCF-CF Compliance|profile_name"
          metric_name: "VCF-CF Compliance|Profile Name"
          label: "SCG Applied"
          is_string_metric: true
        - adapter_kind: VMWARE
          resource_kind: VirtualMachine
          metric_key: "VCF-CF Compliance|total_count"
          metric_name: "VCF-CF Compliance|Total Count"
          label: "Total Controls"
        - adapter_kind: VMWARE
          resource_kind: VirtualMachine
          metric_key: "VCF-CF Compliance|pass_count"
          metric_name: "VCF-CF Compliance|Pass Count"
          label: "Passing"
        - adapter_kind: VMWARE
          resource_kind: VirtualMachine
          metric_key: "VCF-CF Compliance|fail_count"
          metric_name: "VCF-CF Compliance|Fail Count"
          label: "Failing"
        - adapter_kind: VMWARE
          resource_kind: VirtualMachine
          metric_key: "VCF-CF Compliance|unreadable_count"
          metric_name: "VCF-CF Compliance|Unreadable Count"
          label: "Unreadable"

  # ── W5: Score Trend, driven by W2 ────────────────────────────────────

  - id: vm_score_trend
    type: MetricChart
    title: "Score Trend"
    coords: {x: 1, y: 21, w: 12, h: 5}
    metrics:
      - adapter_kind: VMWARE
        resource_kind: VirtualMachine
        metric_key: "VCF-CF Compliance|score"
        metric_name: "Compliance Score"
        color_method: 2
      - adapter_kind: VMWARE
        resource_kind: VirtualMachine
        metric_key: "VCF-CF Compliance|fail_count"
        metric_name: "Failing Controls"
        color_method: 2

interactions:
  - from: scope_picker
    to: vm_compliance_view
    type: resourceId
  - from: vm_compliance_view
    to: failing_controls
    type: resourceId
  - from: vm_compliance_view
    to: vm_compliance_details
    type: resourceId
  - from: vm_compliance_view
    to: vm_score_trend
    type: resourceId
