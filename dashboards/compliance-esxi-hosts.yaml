id: e2e42416-53d7-49fb-85d6-68bd9323aae8
name: "[VCF Content Factory] Compliance ESX Hosts"
description: >
  Pick a scope (whole environment, one vCenter, or one cluster), see
  every host in it worst first with its score and applied SCG, then
  select a host to see exactly which controls fail and their runbook
  remediation. "Which controls fail" comes from the per-control
  compliance alerts (subType 21), one alert per failing control. See
  knowledge/designs/dashboards/compliance-esxi-hosts.md.

released: false
version: "1.0.0"
hidden: true

widgets:

  # ── W1: Scope picker (World / vCenter) ───────────────────────────────

  - id: scope_picker
    type: ResourceList
    title: "Scope"
    coords: {x: 1, y: 1, w: 3, h: 12}
    column_preset: name-only
    resource_kinds:
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
      - adapter_kind: VMWARE
        resource_kind: "VMwareAdapter Instance"

  # ── W2: Host Compliance list, driven by W1, sorted worst-first ──────

  - id: host_compliance_view
    type: View
    title: "Host Compliance"
    coords: {x: 4, y: 1, w: 9, h: 12}
    # sort_by_column / sort_by_dir requested in the brief are not
    # implemented for View widgets (loader accepts and silently drops
    # them; render.py's sortBy/sortByDir only exists on HealthChart).
    # See TOOLSET GAP in the authoring report. Sort order is UI-set by
    # the user on first load, per the design guide's "Initial sort
    # order in YAML: Not configurable" row.
    view: "[VCF Content Factory] Compliance Host Detail"

  # ── W3: Host Score Heatmap, driven by W1, grouped by parent cluster ──

  - id: host_score_heatmap
    type: Heatmap
    title: "Host Score Heatmap"
    coords: {x: 1, y: 13, w: 5, h: 8}
    mode: all
    depth: 10
    configs:
      - name: "Compliance Score"
        adapter_kind: VMWARE
        resource_kind: HostSystem
        color_by:
          metric_key: "VCF-CF Compliance|score"
          label: "Compliance Score"
        group_by:
          adapter_kind: VMWARE
          resource_kind: ClusterComputeResource
          text: "Cluster"
        color:
          min_value: 0
          thresholds:
            values: [0, 80, 95]
            colors: ["#DE3F30", "#ECC33E", "#74B43B"]
        solid_coloring: false
        focus_on_groups: false

  # ── W4: Failing Controls on Selected Host, driven by W2 ─────────────

  - id: failing_controls
    type: AlertList
    title: "Failing Controls on Selected Host"
    coords: {x: 6, y: 13, w: 7, h: 8}
    criticality: [2, 3, 4]
    mode: all
    # depth 1: input is a HostSystem; its only compliance-bearing child level is VirtualMachine, 1 level.
    depth: 1
    alert_types: ["15_21"]  # Application / Compliance, every pak alert is type 15 subType 21

  # ── W5: Score Trend, driven by W2 ────────────────────────────────────

  - id: host_score_trend
    type: MetricChart
    title: "Score Trend"
    coords: {x: 1, y: 21, w: 6, h: 6}
    metrics:
      - adapter_kind: VMWARE
        resource_kind: HostSystem
        metric_key: "VCF-CF Compliance|score"
        metric_name: "Compliance Score"
        color_method: 2
      - adapter_kind: VMWARE
        resource_kind: HostSystem
        metric_key: "VCF-CF Compliance|fail_count"
        metric_name: "Failing Controls"
        color_method: 2

  # ── W6: Compliance Details, driven by W2 ────────────────────────────

  - id: host_compliance_details
    type: PropertyList
    title: "Compliance Details"
    coords: {x: 7, y: 21, w: 6, h: 6}
    property_list:
      visual_theme: 0
      depth: 1
      show_metric_full_name: true
      properties:
        - adapter_kind: VMWARE
          resource_kind: HostSystem
          metric_key: "summary|version"
          metric_name: "Summary|Version"
          label: "ESX Version"
          is_string_metric: true
        - adapter_kind: VMWARE
          resource_kind: HostSystem
          metric_key: "VCF-CF Compliance|profile_name"
          metric_name: "VCF-CF Compliance|Profile Name"
          label: "SCG Applied"
          is_string_metric: true
        - adapter_kind: VMWARE
          resource_kind: HostSystem
          metric_key: "VCF-CF Compliance|total_count"
          metric_name: "VCF-CF Compliance|Total Count"
          label: "Total Controls"
        - adapter_kind: VMWARE
          resource_kind: HostSystem
          metric_key: "VCF-CF Compliance|pass_count"
          metric_name: "VCF-CF Compliance|Pass Count"
          label: "Passing"
        - adapter_kind: VMWARE
          resource_kind: HostSystem
          metric_key: "VCF-CF Compliance|fail_count"
          metric_name: "VCF-CF Compliance|Fail Count"
          label: "Failing"
        - adapter_kind: VMWARE
          resource_kind: HostSystem
          metric_key: "VCF-CF Compliance|unreadable_count"
          metric_name: "VCF-CF Compliance|Unreadable Count"
          label: "Unreadable"

interactions:
  - from: scope_picker
    to: host_compliance_view
    type: resourceId
  - from: scope_picker
    to: host_score_heatmap
    type: resourceId
  - from: host_compliance_view
    to: failing_controls
    type: resourceId
  - from: host_compliance_view
    to: host_score_trend
    type: resourceId
  - from: host_compliance_view
    to: host_compliance_details
    type: resourceId
