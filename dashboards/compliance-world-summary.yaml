id: 4e2c777e-9c6c-4c6a-bc16-ab55b6110f33
name: "[VCF Content Factory] Compliance World Summary"
description: >
  Summary tab for the ComplianceWorld object: the four engine-computed
  environment tiles, the last scan time, the per-vCenter table, the score
  trend, the SCG version spread and the open compliance alerts. The
  Environment Overview re-cut for the Summary tab: every widget inherits
  the page object (ComplianceWorld), nothing is pinned or self-provider.
  See knowledge/designs/dashboards/compliance-world-summary.md.

released: false
version: "1.0.0"
hidden: true

summary_for: "vcfcf_compliance:ComplianceWorld"

widgets:

  # Row 1: Environment Compliance (page object ComplianceWorld) | Scan.
  - id: env_compliance_scoreboard
    type: Scoreboard
    title: "Environment Compliance"
    coords: {x: 1, y: 1, w: 9, h: 4}
    self_provider: false
    box_columns: 4
    metrics:
      # Controls Passing (build 95, was Average Score): controls passed
      # over controls evaluated, environment-wide (a ratio of sums, see
      # describe.xml). Lower is worse. Scoreboard color thresholds are
      # ascending-only (>= yellow/orange/red = worse; see loader
      # MetricSpec docstring and knowledge/lessons/
      # scoreboard-partial-bounds-render-unknown.md), so the wireframe's
      # "red < 80, orange < 90, yellow < 95" cannot be expressed here.
      # Left uncolored (color_method: 1). Reported as a TOOLSET GAP.
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|pass_rate"
        metric_name: "Controls Passing"
        label: "Controls Passing"
        unit: "%"
        color_method: 1
      # Non-Compliant Objects: higher is worse, matches Scoreboard's
      # native ascending semantics. Wireframe specifies only "yellow >=
      # 1"; orange/red steps below are authored judgment (not in the
      # wireframe), scaled for an environment-wide count.
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|non_compliant"
        metric_name: "Non-Compliant Objects"
        label: "Non-Compliant"
        color_method: 0
        yellow_bound: 1
        orange_bound: 5
        red_bound: 20
      # Without Benchmark: wireframe specifies only "orange >= 1"; yellow
      # is set equal to orange so any count at all is at least orange
      # (an object with no matching SCG is a coverage gap, not a soft
      # warning). Red step is authored judgment.
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|no_benchmark"
        metric_name: "Without Benchmark"
        label: "Without Benchmark"
        color_method: 0
        yellow_bound: 1
        orange_bound: 1
        red_bound: 5
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|scored"
        metric_name: "Objects Scored"
        label: "Objects Scored"
        color_method: 1

  - id: scan_time
    type: PropertyList
    title: "Scan"
    coords: {x: 10, y: 1, w: 3, h: 4}
    self_provider: false
    property_list:
      visual_theme: 0
      depth: 1
      show_metric_full_name: true
      properties:
        - adapter_kind: vcfcf_compliance
          resource_kind: ComplianceWorld
          metric_key: "Summary|last_scan_timestamp"
          metric_name: "Summary|last_scan_timestamp"
          label: "Last Scan"
          is_string_metric: true

  # Row 2: per-vCenter table, descendants of the page object.
  - id: vcenter_object_type_view
    type: View
    title: "Compliance by vCenter and Object Type"
    coords: {x: 1, y: 5, w: 12, h: 8}
    self_provider: false
    select_first_row: true
    view: "[VCF Content Factory] Compliance by vCenter and Object Type"

  # Row 3: SCG version spread (full width), then the trend (build 95).
  - id: env_score_trend
    type: MetricChart
    title: "Environment Score Trend"
    coords: {x: 1, y: 18, w: 12, h: 7}
    self_provider: false
    metrics:
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|pass_rate"
        metric_name: "Controls Passing"
        color_method: 2
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|non_compliant"
        metric_name: "Non-Compliant Objects"
        color_method: 2

  - id: scg_version_view
    type: View
    title: "Objects by SCG Version"
    # Build 95 (issue #32): full width, so every SCG column shows.
    coords: {x: 1, y: 13, w: 12, h: 5}
    self_provider: false
    view: "[VCF Content Factory] Compliance Objects by SCG Version"

  # Row 4: alerts, driven by the row 2 selection.
  - id: open_compliance_alerts
    type: AlertList
    title: "Open Compliance Alerts"
    coords: {x: 1, y: 25, w: 12, h: 7}
    criticality: [2, 3, 4]
    mode: all
    # depth 4: input is the selected vCenter row of the view above (select_first_row, so never the ComplianceWorld itself); vCenter > Datacenter > Cluster > HostSystem > VirtualMachine is 4 levels (vDS and port group chains are shorter).
    depth: 4
    alert_types: ["15_21"]  # Application / Compliance. Every pak alert is type 15 subType 21, so this lists all of them: per-control, "Compliance data not collected" and "Host Compliance Score Degraded" alike (no widget filter separates them; pinning the 143 definition ids was ruled out)

interactions:
  - from: vcenter_object_type_view
    to: open_compliance_alerts
    type: resourceId
