id: 155743b0-15e0-40e4-acd3-05f68f8684d4
name: "[VCF Content Factory] Compliance Environment Overview"
description: >
  Top-level page of the compliance four-dashboard set. Answers how
  compliant the environment is, which object types and vCenters drag it
  down, and which SCG versions are in play, all without a click.
  Replaces the retired Compliance Fleet Overview (its ComplianceWorld
  Summary metrics are last-writer-wins across the three adapter
  instances sharing one ComplianceWorld; this dashboard reads
  per-vCenter rollups stitched onto each VMWARE VMwareAdapter Instance
  instead, plus environment-wide super metrics on vSphere World). The
  per-kind dashboards (ESX Hosts, VMs, vCenter & Networking) are where
  a user acts on a single object. See
  knowledge/designs/dashboards/compliance-environment-overview.md.

released: false
version: "1.0.0"
hidden: true

widgets:

  # ── W1: Environment Compliance scoreboard (self-provider, pinned
  #     vSphere World) ─────────────────────────────────────────────────

  - id: env_compliance_scoreboard
    type: Scoreboard
    title: "Environment Compliance"
    coords: {x: 1, y: 1, w: 8, h: 4}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    box_columns: 4
    metrics:
      # Average Score: lower is worse. Scoreboard color thresholds are
      # ascending-only (>= yellow/orange/red = worse; see loader
      # MetricSpec docstring and knowledge/lessons/
      # scoreboard-partial-bounds-render-unknown.md), so the wireframe's
      # "red < 80, orange < 90, yellow < 95" cannot be expressed here.
      # Left uncolored (color_method: 1). Reported as a TOOLSET GAP.
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
        metric_key: "Super Metric|sm_a3292c87-15b7-4fcd-beea-1b4510b3ca02"
        metric_name: "[VCF Content Factory] Compliance Average Score"
        label: "Average Score"
        unit: "%"
        color_method: 1
      # Non-Compliant Objects: higher is worse, matches Scoreboard's
      # native ascending semantics. Wireframe specifies only "yellow >=
      # 1"; orange/red steps below are authored judgment (not in the
      # wireframe), scaled for an environment-wide count.
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
        metric_key: "Super Metric|sm_349307c4-2af7-4d83-90d2-1ad4f60138bf"
        metric_name: "[VCF Content Factory] Compliance Non-Compliant Objects"
        label: "Non-Compliant"
        color_method: 0
        yellow_bound: 1
        orange_bound: 5
        red_bound: 20
      # Without Benchmark: wireframe specifies only "orange >= 1"; yellow
      # is set equal to orange so any count at all is at least orange
      # (an object with no matching SCG is a coverage gap, not a soft
      # warning). Red step is authored judgment.
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
        metric_key: "Super Metric|sm_8200eed9-6aa3-480d-bd7e-2b1fa81b8ee5"
        metric_name: "[VCF Content Factory] Compliance Objects Without Benchmark"
        label: "Without Benchmark"
        color_method: 0
        yellow_bound: 1
        orange_bound: 1
        red_bound: 5
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
        metric_key: "Super Metric|sm_c72131ad-ee25-4e89-8190-1c93d78eeb5a"
        metric_name: "[VCF Content Factory] Compliance Objects Scored"
        label: "Objects Scored"
        color_method: 1

  # ── W2: About this dashboard ─────────────────────────────────────────

  - id: about_text
    type: TextDisplay
    title: "About This Dashboard"
    coords: {x: 9, y: 1, w: 4, h: 4}
    text: >
      <p><b>Non-compliant</b> means an object has at least one failing
      or unreadable control. Unreadable counts as non-compliant, never
      as passing.</p>
      <p><b>Without benchmark</b> means the object's version has no
      matching Security Configuration Guide in this pak; it is counted,
      never scored.</p>
      <p>Drill into a single object type: Compliance ESX Hosts,
      Compliance VMs, Compliance vCenter &amp; Networking.</p>

  # ── W3/W4: per-vCenter rollups (self-provider, pinned vSphere World,
  #     children VMwareAdapter Instance) ───────────────────────────────

  - id: vcenter_object_type_view
    type: View
    title: "Compliance by vCenter and Object Type"
    coords: {x: 1, y: 5, w: 12, h: 8}
    self_provider: true
    # Owner decision: keep the default (true) explicit so W6 populates
    # with the first vCenter's alerts on load instead of sitting blank.
    select_first_row: true
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    view: "[VCF Content Factory] Compliance by vCenter and Object Type"

  - id: scg_version_view
    type: View
    title: "Objects by SCG Version"
    coords: {x: 1, y: 13, w: 6, h: 7}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    view: "[VCF Content Factory] Compliance Objects by SCG Version"

  # ── W5: Environment Score Trend (self-provider, pinned vSphere World)

  - id: env_score_trend
    type: MetricChart
    title: "Environment Score Trend"
    coords: {x: 7, y: 13, w: 6, h: 7}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    metrics:
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
        metric_key: "Super Metric|sm_a3292c87-15b7-4fcd-beea-1b4510b3ca02"
        metric_name: "[VCF Content Factory] Compliance Average Score"
        color_method: 2
      - adapter_kind: VMWARE
        resource_kind: "vSphere World"
        metric_key: "Super Metric|sm_349307c4-2af7-4d83-90d2-1ad4f60138bf"
        metric_name: "[VCF Content Factory] Compliance Non-Compliant Objects"
        color_method: 2

