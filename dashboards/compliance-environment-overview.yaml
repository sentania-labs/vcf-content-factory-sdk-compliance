id: 155743b0-15e0-40e4-acd3-05f68f8684d4
name: "[VCF Content Factory] Compliance Environment Overview"
description: >
  Top-level page of the compliance four-dashboard set. Answers how
  compliant the environment is, which object types and vCenters drag it
  down, and which SCG versions are in play, all without a click.
  Replaces the retired Compliance Fleet Overview (its ComplianceWorld
  Summary metrics are last-writer-wins across the three adapter
  instances sharing one ComplianceWorld; this dashboard reads
  per-vCenter rollups stitched onto each VMWARE VMwareAdapter Instance
  instead, plus the engine-computed Rollup|Environment|* totals on the
  pak's own ComplianceWorld singleton, which no instance pushes). The
  per-kind dashboards (ESX Hosts, VMs, vCenter & Networking) are where
  a user acts on a single object. See
  knowledge/designs/dashboards/compliance-environment-overview.md.

released: false
version: "1.0.0"
hidden: true

widgets:

  # ── W1: Environment Compliance scoreboard (self-provider, pinned to
  #     the pak's own ComplianceWorld singleton). Data source: the
  #     engine-computed Rollup|Environment|* metrics declared as
  #     ComputedMetrics in describe.xml (ResourceGroup Rollup >
  #     Environment). They sum the per-vCenter Rollup|All|* keys, one
  #     collection interval behind, and skip one point on a pak upgrade.
  #     Replaces the four retired Compliance super metrics on vSphere
  #     World. ─────────────────────────────────────────────────────────

  - id: env_compliance_scoreboard
    type: Scoreboard
    title: "Environment Compliance"
    # Build 95: narrower (two boxes a row) to make room for the Objects
    # with Unreadable Controls list beside it; the first row is one taller.
    coords: {x: 1, y: 1, w: 4, h: 6}
    self_provider: true
    pin:
      adapter_kind: vcfcf_compliance
      resource_kind: ComplianceWorld
    box_columns: 2
    metrics:
      # Controls Passing (build 95, was Average Score): controls passed
      # over controls evaluated, environment-wide (a ratio of sums, see
      # describe.xml). Lower is worse. Scoreboard color thresholds are
      # ascending-only (>= yellow/orange/red = worse; see loader
      # MetricSpec docstring and knowledge/lessons/
      # scoreboard-partial-bounds-render-unknown.md), so the wireframe's
      # "red < 80, orange < 90, yellow < 95" cannot be expressed here.
      # Left uncolored (color_method: 1). Reported as a TOOLSET GAP.
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|pass_rate"
        metric_name: "Controls Passing"
        label: "Controls Passing"
        unit: "%"
        color_method: 1
      # Non-Compliant Objects: higher is worse, matches Scoreboard's
      # native ascending semantics. Wireframe specifies only "yellow >=
      # 1"; orange/red steps below are authored judgment (not in the
      # wireframe), scaled for an environment-wide count.
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|non_compliant"
        metric_name: "Non-Compliant Objects"
        label: "Non-Compliant"
        color_method: 0
        yellow_bound: 1
        orange_bound: 5
        red_bound: 20
      # Without Benchmark: wireframe specifies only "orange >= 1"; yellow
      # is set equal to orange so any count at all is at least orange
      # (an object with no matching SCG is a coverage gap, not a soft
      # warning). Red step is authored judgment.
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|no_benchmark"
        metric_name: "Without Benchmark"
        label: "Without Benchmark"
        color_method: 0
        yellow_bound: 1
        orange_bound: 1
        red_bound: 5
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|scored"
        metric_name: "Objects Scored"
        label: "Objects Scored"
        color_method: 1

  # ── Build 95 (Scott 2026-10-14): Objects with Unreadable Controls,
  #     beside the Controls Passing tile. Every object whose last cycle
  #     could not read some controls (has_unreadable = 1): object, kind,
  #     count, reason. Self-provider pinned vSphere World, descendants of
  #     the six kinds; the view filters on the flag. ─────────────────────

  - id: unreadable_objects_view
    type: View
    title: "Objects with Unreadable Controls"
    coords: {x: 5, y: 1, w: 5, h: 6}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    view: "[VCF Content Factory] Compliance Objects with Unreadable Controls"

  # ── W2: About this dashboard ─────────────────────────────────────────

  - id: about_text
    type: TextDisplay
    title: "About This Dashboard"
    # Build 95 (issue #34): shorter text and one more row of height, so
    # the last line no longer runs under the widget's EDIT link.
    # Build 95: one column narrower and one row taller (the unreadable
    # list sits between it and the scoreboard).
    coords: {x: 10, y: 1, w: 3, h: 6}
    text: >
      <p><b>Controls Passing</b>: controls passed over controls evaluated,
      from what was read. Unreadable objects are listed apart.</p>
      <p><b>Non-compliant</b>: a failing control that was read.
      <b>Without benchmark</b>: no SCG for the version.</p>
      <p>Per object: ESX Hosts, VMs, vCenter &amp; Networking.</p>

  # ── W3/W4: per-vCenter rollups (self-provider, pinned vSphere World,
  #     children VMwareAdapter Instance) ───────────────────────────────

  - id: vcenter_object_type_view
    type: View
    title: "Compliance by vCenter and Object Type"
    coords: {x: 1, y: 7, w: 12, h: 8}
    self_provider: true
    # Show-all-then-narrow (factory issue #177): with nothing selected the
    # AlertList receiver lists every alert matching its filters, and it
    # narrows once a row is clicked here. With true the first vCenter row
    # was auto-selected, so W6 opened already narrowed to one vCenter.
    # Evidence: knowledge/context/wire-formats/dashboard_sort_color_default_summary_rows.md
    # section #177 (factory repo); the vendor Cluster Performance
    # dashboard uses the same pattern.
    select_first_row: false
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    view: "[VCF Content Factory] Compliance by vCenter and Object Type"

  - id: scg_version_view
    type: View
    title: "Objects by SCG Version"
    # Build 95 (issue #32): full width, so every SCG column shows.
    coords: {x: 1, y: 15, w: 12, h: 5}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: "vSphere World"
    view: "[VCF Content Factory] Compliance Objects by SCG Version"

  # ── W5: Environment Score Trend (self-provider, pinned ComplianceWorld;
  #     same Rollup|Environment|* source as W1)

  - id: env_score_trend
    type: MetricChart
    title: "Environment Score Trend"
    coords: {x: 1, y: 20, w: 12, h: 7}
    self_provider: true
    pin:
      adapter_kind: vcfcf_compliance
      resource_kind: ComplianceWorld
    metrics:
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|pass_rate"
        metric_name: "Controls Passing"
        color_method: 2
      - adapter_kind: vcfcf_compliance
        resource_kind: ComplianceWorld
        metric_key: "Rollup|Environment|non_compliant"
        metric_name: "Non-Compliant Objects"
        color_method: 2

  # ── W6: Open Compliance Alerts (interaction-driven from W3; every
  #     pak alert of the Compliance type: the per-control alerts, the
  #     "Compliance data not collected" alerts and the aggregate "Host
  #     Compliance Score Degraded" alert. The type filter cannot separate
  #     them and pinning definition ids was ruled out; Score Degraded in
  #     the list is accepted, owner decision 2026-10-13, PR #44).
  #     Exception (issue #64): a Score Degraded alert raised before build
  #     57 keeps the subType it was raised with (20, Capacity) until it
  #     cancels, so this 15_21 filter does not list it.

  - id: open_compliance_alerts
    type: AlertList
    title: "Open Compliance Alerts"
    coords: {x: 1, y: 27, w: 12, h: 7}
    criticality: [2, 3, 4]
    status: [0]  # active only; an empty list means no status filter and lists canceled alerts too (investigation 2026-10-24 part 2)
    mode: all
    # depth 4: input is a VMwareAdapter Instance (vCenter); vCenter > Datacenter > Cluster > HostSystem > VirtualMachine is 4 levels (vDS and port group chains are shorter).
    depth: 4
    alert_types: ["15_21"]  # Application / Compliance. Every pak alert definition is type 15 subType 21, so this lists every alert raised under them: per-control, "Compliance data not collected" and "Host Compliance Score Degraded" alike (no widget filter separates them; pinning the 143 definition ids was ruled out). Not listed: a Score Degraded alert raised before build 57 (definition then subType 20), which keeps subType 20 until it cancels (issue #64)

interactions:
  - from: vcenter_object_type_view
    to: open_compliance_alerts
    type: resourceId
