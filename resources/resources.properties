2100=The compliance adapter could not read one or more security settings on this object, so they were not collected and count as failing in its compliance score (they are not reported as violations, and raise no per-control alert). Common causes: the object or its ESX host is disconnected or not responding in vCenter; the adapter's vCenter account lacks read permission for the setting; or the read method is not supported on this product version. If the object's product version itself could not be read, nothing was collected: the object scores 0 and collection_failed is 1. To see which settings: open the object's VCF-CF Compliance metrics; unreadable_count gives the number, and each control whose Compliant value is -1 with Actual "(unreadable)" is one of them (the compliance dashboards' object lists show the count in their Unreadable column). Check the object's connection state in vCenter, the adapter account's permissions (read-only at the vCenter root, propagated to children), and the adapter log for read errors naming this object (the log also gives, once per cycle, a count of unreadable settings by reason). For the vCenter appliance settings (read only when the instance's "Read vCenter appliance settings" option is on), the account must be in the vsphere.local SSO group SystemConfiguration.Administrators; that group also grants appliance WRITE access (there is no read-only appliance role), so decide whether that trade-off is acceptable before granting it, or turn the option off to report those settings for manual review. The alert clears on the first collection cycle in which every setting is read.
