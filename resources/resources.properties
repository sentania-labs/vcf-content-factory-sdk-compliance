1=VCF Content Factory Compliance
2=vCenter Credentials
3=Username
4=Password
5=VCF Compliance Adapter
6=vCenter Host / IP
7=Compliance Profile
8=Custom Profile CSV Path (required if profile is Custom)
9=Allow Insecure SSL (true to disable cert validation; default false = validate against platform trust store)
10=Read vCenter appliance settings (true needs the account in SSO group SystemConfiguration.Administrators, which also grants appliance write access)
20=Compliance World
21=World ID
22=Summary
27=Last Scan Timestamp
100=Host Compliance Score Below 95%
101=Host Compliance Score Below 80%
102=Host Compliance Score Degraded
103=Review the VCF-CF Compliance properties on the affected host in VCF Operations. Navigate to the host resource and open the Metrics or Properties tab. Each compliance control exposes Actual, Expected, and Description properties that identify exactly which security settings are out of compliance. Focus on controls where the Actual value differs from the Expected value. Sort controls by severity to prioritize remediation effort.
104=Use the VMware Security Configuration Guide (SCG) documentation to understand the remediation steps for each failing control. Most controls map to ESX advanced settings that can be corrected via PowerCLI (Get-VMHost <hostname> | Get-AdvancedSetting -Name <setting> | Set-AdvancedSetting -Value <expected>) or directly in the vSphere Client under Host > Configure > Advanced System Settings. Apply changes during a maintenance window where possible.
105=After remediating failing controls, wait for the next compliance adapter collection cycle (default 60 minutes) to confirm the score recovers above the alert threshold. If using a custom benchmark profile, verify the profile CSV is current. If the score does not recover after two collection cycles, re-check the failing controls to confirm Actual values changed; some settings require an ESX service restart or host reboot.
