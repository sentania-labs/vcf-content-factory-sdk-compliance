# Adapter reproducibility gates on every push and pull request (compliance
# builds 59, 60, 94): the generated-alert currency check, then
# ci/run_java_tests.sh on JDK 17 and 25. Both also gate the tag build in
# build-pak-on-tag.yml. The job now lives in the SDK template's reusable
# workflow, which carries the full rationale (GitHub-hosted only, no
# secrets, no SDK jar, why two JDKs):
# sentania-labs/vcf-content-factory-sdk-template/.github/workflows/pak-tests.yml
# This repo adds only the pre-check. Job ids are `tests` on both sides, so
# the legs report as `tests / tests (17)` and `tests / tests (25)`.
name: tests

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: sentania-labs/vcf-content-factory-sdk-template/.github/workflows/pak-tests.yml@ci/reusable-pak-tests
    with:
      pre-check: python3 scripts/generate_compliance_alerts.py --check
