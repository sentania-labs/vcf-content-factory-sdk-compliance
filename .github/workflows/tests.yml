# Adapter reproducibility gates on every push and pull request (compliance
# build 59, review N4 on build 58). The same two steps also gate the tag
# build in build-pak-on-tag.yml; running them here catches a stale
# generated alert block or a failing unit test a round before release.
#
# GitHub-hosted runner, never the self-hosted pool (build 60, review B1 on
# build 59): this repo is public and the job runs pull-request code, so it
# must not share a runner with the release job (which holds
# SDK_RUNTIME_SSH_KEY and contents: write). It needs neither the lab nor a
# Docker daemon. Actions stay pinned to full commit SHAs.
#
# No secrets and no Broadcom SDK jar, ever: every suite in
# ci/run_java_tests.sh (BenchmarkLoaderTest, ProfileSetTest,
# BenchmarkSelectorTest, ControlEvaluatorTest, ComplianceRollupTest,
# ComplianceDecisionsTest, MixedVersionSimulationTest) and the generator's
# unittest suite compile and run on a plain JDK + python3, so the full set
# runs here, and the same set gates the tag build.
name: tests

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check generated alert definitions are current
        run: python3 scripts/generate_compliance_alerts.py --check

      - name: Run adapter unit tests
        run: bash ci/run_java_tests.sh
